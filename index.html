<!DOCTYPE html>
<html lang="si">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randika Tatoos</title>
<style>
  :root { --bg:#0b0b0d; --card:#16161a; --line:#2b2b33; --txt:#f2f2f2; --mute:#9a9aa5; --acc:#39ff14; --glow:57,255,20; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,"Noto Sans Sinhala",sans-serif; }
  .wrap { position:relative; z-index:1; }
  /* ---------- login ---------- */
  #authView { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { width:100%; max-width:380px; background:rgba(22,22,26,.92); border:1px solid var(--line);
         border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:26px; letter-spacing:2px; text-align:center; }
  .sub { text-align:center; color:var(--mute); font-size:13px; margin-bottom:18px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; background:transparent; color:var(--mute);
                 border:1px solid var(--line); border-radius:10px; font-size:15px; cursor:pointer; }
  .tabs button.on { background:var(--acc); color:#03120a; border-color:var(--acc); }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; }
  input { width:100%; padding:12px; background:#0f0f13; color:var(--txt); border:1px solid var(--line);
          border-radius:10px; font-size:16px; }
  input:focus { outline:none; border-color:var(--acc); }
  .go { width:100%; margin-top:18px; padding:13px; background:var(--acc); border:0;
        border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; color:#03120a;
        display:block; text-align:center; }
  .go:disabled { opacity:.6; }
  .msg { margin-top:12px; font-size:14px; text-align:center; min-height:20px; }
  .err { color:#ff6b75; } .ok { color:#5ad39a; }
  .hide { display:none !important; }
  /* ---------- studio ---------- */
  section { min-height:100vh; padding:60px 20px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center; }
  .hero h2 { font-size:15px; color:var(--mute); font-weight:400; margin:0 0 12px; }
  .big { font-size:clamp(46px,14vw,120px); font-weight:900; letter-spacing:4px; line-height:1;
         margin:0; -webkit-text-stroke:2px var(--acc); color:transparent; animation:fill 3s ease 1s forwards; }
  @keyframes fill { to { color:var(--acc); text-shadow:0 0 40px rgba(57,255,20,.6); } }
  .hint { margin-top:28px; color:var(--mute); font-size:14px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  h3 { font-size:24px; margin:0 0 6px; } .lead { color:var(--mute); margin:0 0 28px; font-size:14px; }
  .designs { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
  .design { width:210px; background:rgba(22,22,26,.85); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .design svg { width:100%; height:190px; }
  .design svg * { fill:none; stroke:var(--acc); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
                  stroke-dasharray:1; stroke-dashoffset:1; }
  .design.in svg * { animation:draw 3.2s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .design b { display:block; margin-top:8px; }
  /* body map */
  .map { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; align-items:center; }
  .map svg { width:200px; height:300px; }
  .body * { fill:none; stroke:#555; stroke-width:2; }
  .hot { fill:var(--acc) !important; stroke:none !important; cursor:pointer; animation:beat 1.6s infinite;
         transform-box:fill-box; transform-origin:center; }
  @keyframes beat { 50% { transform:scale(1.5); opacity:.5; } }
  #zoneInfo { max-width:260px; min-height:110px; background:rgba(22,22,26,.85); border:1px solid var(--line);
              border-radius:14px; padding:16px; text-align:left; font-size:14px; line-height:1.6; }
  .out { background:transparent; border:1px solid var(--line); color:var(--txt); max-width:260px; margin:12px auto 0; }

  /* ---------- neon ---------- */
  .go { box-shadow:0 0 10px var(--acc),0 0 26px rgba(var(--glow),.55); }
  .go.out { background:transparent; color:var(--acc); border:1px solid var(--acc);
            box-shadow:0 0 10px rgba(var(--glow),.5); text-shadow:0 0 8px var(--acc); }
  .tabs button.on { box-shadow:0 0 12px var(--acc); }
  .tabs button:not(.on) { border-color:rgba(var(--glow),.35); }
  input { border-color:rgba(var(--glow),.3); }
  input:focus { box-shadow:0 0 12px var(--acc); }
  .box, .design, #zoneInfo { border-color:rgba(var(--glow),.4); box-shadow:0 0 22px rgba(var(--glow),.15); }
  h1, h3 { text-shadow:0 0 14px rgba(var(--glow),.8); }
  .design svg * { filter:drop-shadow(0 0 4px var(--acc)); }
  .hot { filter:drop-shadow(0 0 6px var(--acc)); }
  .body *:not(.hot) { stroke:rgba(var(--glow),.55); }

  /* ---------- colourful ---------- */
  :root { --c1:#39ff14; --c2:#ff2bd6; --c3:#00f0ff; --c4:#ffe600; --c5:#b967ff; --mute:#cfd2ff; }
  h1 { color:var(--c2); text-shadow:0 0 16px var(--c2); }
  h3 { color:var(--c3); text-shadow:0 0 14px var(--c3); }
  label, .lead { color:var(--c3); }
  .sub, .hint { color:var(--c4); text-shadow:0 0 8px rgba(255,230,0,.5); }
  .hero h2 { color:var(--c2); text-shadow:0 0 12px var(--c2); font-size:18px; }
  .tabs button:not(.on) { color:var(--c3); border-color:rgba(0,240,255,.55); }
  input::placeholder { color:#8fd9ff; opacity:.8; }
  .box { border-color:rgba(255,43,214,.55); box-shadow:0 0 26px rgba(255,43,214,.22),0 0 46px rgba(0,240,255,.12); }
  .err { color:#ff4d6d; text-shadow:0 0 8px rgba(255,77,109,.6); }
  .design:nth-child(1) { --dc:var(--c2); } .design:nth-child(2) { --dc:var(--c3); } .design:nth-child(3) { --dc:var(--c4); }
  .design { border-color:var(--dc); box-shadow:0 0 22px color-mix(in srgb,var(--dc) 30%,transparent); }
  .design svg * { stroke:var(--dc); filter:drop-shadow(0 0 4px var(--dc)); }
  .design b { color:var(--dc); font-size:16px; text-shadow:0 0 8px var(--dc); }
  .body *:not(.hot) { stroke:var(--c5); stroke-width:2.6; filter:drop-shadow(0 0 4px var(--c5)); }
  .hot[data-z="neck"] { fill:var(--c2) !important; } .hot[data-z="chest"] { fill:var(--c4) !important; }
  .hot[data-z="arm"] { fill:var(--c3) !important; } .hot[data-z="leg"] { fill:var(--c1) !important; }
  #zoneInfo { color:#eafff6; border-color:var(--c3); box-shadow:0 0 22px rgba(0,240,255,.25); font-size:15px; }
  .go.out { color:var(--c2); border-color:var(--c2); text-shadow:0 0 8px var(--c2); box-shadow:0 0 12px rgba(255,43,214,.5); }

  /* ---------- buttons: එක පාටක් + සියුම් charm ---------- */
  .go, .tabs button.on { background:linear-gradient(180deg,#63ff45,#2fe611); color:#03120a; animation:none; }
  .go { letter-spacing:.5px; box-shadow:0 4px 14px rgba(57,255,20,.35); transition:transform .15s, box-shadow .15s; }
  .go:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(57,255,20,.55); }
  .go:active { transform:translateY(1px) scale(.99); }
  .tabs button.on { box-shadow:0 2px 10px rgba(57,255,20,.4); }

  /* ---------- brand ---------- */
  #studio { position:relative; }
  .brand { position:absolute; top:26px; left:0; right:0; text-align:center; z-index:2;
           font-size:clamp(26px,7vw,46px); font-weight:800; letter-spacing:3px;
           color:var(--c2); text-shadow:0 0 18px var(--c2),0 0 36px rgba(255,43,214,.45); }

  /* ---------- neon scrollbar ---------- */
  html { background:var(--bg); scrollbar-width:thin; scrollbar-color:var(--acc) var(--bg); }
  @supports not (scrollbar-color:auto) {
    ::-webkit-scrollbar { width:10px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--acc); border-radius:8px; border:2px solid var(--bg); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="studio">
    <div class="brand">Randika Tatoos</div>
    <section class="hero">
      <p class="big">INK<br>IS<br>FOREVER</p>
      </section>

    <section>
      <h3>අපේ නිර්මාණ</h3>
      <p class="lead">tattoo එකක් ඇඳෙන හැටි බලන්න</p>
      <div class="designs">
        <div class="design"><svg viewBox="0 0 200 200" id="mandala"></svg><b>Mandala</b></div>
        <div class="design"><svg viewBox="0 0 200 200">
          <path pathLength="1" d="M100 10 L113 120 L100 134 L87 120 Z"/>
          <path pathLength="1" d="M68 134 H132"/><path pathLength="1" d="M100 134 V186"/>
          <path pathLength="1" d="M90 186 H110"/><path pathLength="1" d="M100 24 V112"/></svg><b>Dagger</b></div>
        <div class="design"><svg viewBox="0 0 200 200">
          <path pathLength="1" d="M100 170 C55 160 40 110 100 35 C160 110 145 160 100 170"/>
          <path pathLength="1" d="M100 170 C35 172 15 125 38 90 C60 120 75 140 100 170"/>
          <path pathLength="1" d="M100 170 C165 172 185 125 162 90 C140 120 125 140 100 170"/>
          <path pathLength="1" d="M60 182 H140"/></svg><b>Lotus</b></div>
      </div>
    </section>


    <section>
      <h3>ඔබේ ඉංක් එක අදම පටන් ගමු</h3>
      <p class="lead">නිර්මාණය ගැන WhatsApp එකෙන් අපට කියන්න</p>
      <a class="go" style="max-width:260px" id="wa" target="_blank">WhatsApp කරන්න</a>
      <a class="go out" style="max-width:260px" id="tt" target="_blank" rel="noopener">TikTok බලන්න</a>
      <div id="ttEmbed" style="margin-top:24px;width:100%;max-width:340px;display:flex;justify-content:center"></div>
    </section>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const WHATSAPP = '94787140266';   // <-- ඔබේ WhatsApp අංකය (94 සමඟ) මෙතැනට දාන්න
  const TT_USER = 'randika7487';   // <-- TikTok username එක (@ නැතුව) මෙතැනට දාන්න
  const TIKTOK = 'https://www.tiktok.com/@' + TT_USER;
  $('tt').href = TIKTOK;
  if (TT_USER !== 'YOUR_USERNAME') {
    $('ttEmbed').innerHTML = '<blockquote class="tiktok-embed" cite="' + TIKTOK + '" data-unique-id="' + TT_USER +
      '" data-embed-type="creator" style="max-width:340px;min-width:288px;"><section><a target="_blank" href="' + TIKTOK +
      '">@' + TT_USER + '</a></section></blockquote>';
    const sc = document.createElement('script');
    sc.src = 'https://www.tiktok.com/embed.js'; sc.async = true;
    document.body.appendChild(sc);
  }
  $('wa').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Hi, Tattoo එකක් ගැන දැනගන්න ඕනේ.');

  /* ---------- studio ---------- */
  let ready = false;
  function initStudio() {
    if (ready) return; ready = true;
    // mandala (JS වලින්)
    const m = $('mandala'); let h = '';
    for (let i = 0; i < 12; i++) h += '<ellipse pathLength="1" cx="100" cy="58" rx="13" ry="38" transform="rotate(' + i * 30 + ' 100 100)"/>';
    h += '<circle pathLength="1" cx="100" cy="100" r="14"/><circle pathLength="1" cx="100" cy="100" r="92"/>';
    m.innerHTML = h;
    // scroll වෙද්දී අඳින animation
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: .4 });
    document.querySelectorAll('.design').forEach(d => io.observe(d));
  }

  initStudio();
</script>
</body>
</html>
